version: '3.8'

services:
  db:
    image: postgres:17.5
    container_name: shareVault-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sv_user
      POSTGRES_PASSWORD: sv_pass
      POSTGRES_DB: shareVault
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
