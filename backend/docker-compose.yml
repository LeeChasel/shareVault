services:
  db:
    image: postgres:17.5
    container_name: shareVault-db
    ports:
      - "5332:5432"
    environment:
      POSTGRES_USER: sv_user
      POSTGRES_PASSWORD: sv_pass
      POSTGRES_DB: shareVault
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
  adminer:
    image: adminer
    container_name: shareVault-adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  pgdata:
